name: Daily GitHub ETL

on:
  schedule:
    - cron: "0 9 * * *"   # 9:00 UTC = 2:30 PM IST
  workflow_dispatch:       # manual run button

permissions:
  contents: write          # needed to commit refreshed files back

jobs:
  etl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Extract + load to SQLite
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python pipeline.py

      - name: Update Excel dashboard data
        run: python update_excel.py

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: GitHub_Trending_Dashboard
          path: GitHub_Trending_Dashboard.xlsx

      - name: Commit refreshed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github_repos.db data/ GitHub_Trending_Dashboard.xlsx
          git diff --cached --quiet || git commit -m "chore: daily refresh $(date -u +%F)"
          git push
